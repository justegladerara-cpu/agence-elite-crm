# Contrôle automatique à chaque envoi : lint, tests des calculs, build, parcours de bout en bout
name: Contrôle

on:
  push:
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Tests des calculs
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Taille du JavaScript chargé au démarrage
        run: |
          taille=$(stat -c %s dist/assets/index-*.js)
          echo "index.js : $taille octets"
          test "$taille" -lt 700000
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results
          retention-days: 7
      - name: Dépendances vulnérables
        run: npm audit --audit-level=high
